<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>List an Item | Campus Thrift</title><link rel="stylesheet" href="css/style.css"></head><body><div id="toast"></div>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">C+</span><span>Campus <b>Thrift</b></span></a><nav><a href="listings.html">Browse</a><a href="requests.html">Requests</a><a href="my-listings.html">My Listings</a><a href="my-requests.html">My Requests</a></nav><div class="user-area"><span id="userName"></span><select id="userSelect"></select></div></header>
<main class="page narrow"><div class="page-title"><div><span class="eyebrow">SELL OR DONATE</span><h1>Give your item a new home.</h1><p>Be honest about the condition. Your future buyer will thank you.</p></div></div>
<form id="listingForm" class="form-card"><label>Item name<input required name="itemName" placeholder="e.g. Engineering Drawing Kit"></label><label>Description<textarea required name="description" placeholder="Describe what you're offering..."></textarea></label><div class="two"><label>Category<select name="category"><option>Books</option><option>Electronics</option><option>Stationery</option><option>Hostel</option><option>Fashion</option><option>Lab</option><option>Other</option></select></label><label>Condition<select name="condition"><option>NEW</option><option>LIKE_NEW</option><option selected>GOOD</option><option>FAIR</option><option>POOR</option></select></label></div><div class="two"><label>Listing type<select id="listingType" name="listingType"><option value="SELL">Sell</option><option value="DONATE">Donate for free</option></select></label><label id="priceWrap">Price (₹)<input id="price" type="number" min="0" step="1" name="price" value="300"></label></div><div class="two"><label>Department<input required name="department" value="CSE"></label><label>Year<select name="year"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label></div><label>Image URL <span class="muted">(optional)</span><input name="imageUrl" placeholder="https://..."></label><button class="btn primary wide" type="submit">Publish listing ✦</button></form></main><footer><div><b>Campus Thrift</b><span>Part of CAMPUS+</span></div></footer><script src="js/app.js"></script><script src="js/create-listing.js"></script></body></html>
